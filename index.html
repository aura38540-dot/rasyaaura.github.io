<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation for Sania 🩵</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Trebuchet MS", sans-serif;
  background: linear-gradient(160deg, #87CEEB, #DDF5FF, #A9D8FF);
  color: #355875;
  text-align: center;
}

.page {
  min-height: 100vh;
  padding: 20px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  max-width: 480px;
  padding: 22px 15px;
  background: rgba(255,255,255,.92);
  border: 2px solid white;
  border-radius: 25px;
  box-shadow: 0 8px 28px #75A9C655;
}

.hidden { display: none !important; }

h1 {
  color: #4787B4;
  font-size: 27px;
  margin: 12px 0;
}

p { line-height: 1.5; }

.emoji {
  font-size: 35px;
  animation: float 2s infinite ease-in-out;
}

@keyframes float {
  50% { transform: translateY(-9px); }
}

.cloud {
  position: fixed;
  left: -60px;
  font-size: 35px;
  animation: move 16s linear infinite;
  pointer-events: none;
}

.cloud1 { top: 8%; }
.cloud2 { top: 80%; animation-delay: -8s; }

@keyframes move {
  to { transform: translateX(110vw); }
}

button {
  padding: 13px 21px;
  border: none;
  border-radius: 30px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.open-btn, .yes-btn {
  background: #4F98CA;
  color: white;
}

.no-btn {
  background: #E8EFF5;
  color: #60778A;
  transform-origin: center;
}

.letter {
  background: #FFFDF5;
  border: 1px dashed #C8B18E;
  border-radius: 15px;
  padding: 14px;
  margin: 16px 0;
  text-align: center;
  line-height: 1.6;
  color: #665643;
}

.photo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 18px 0;
}

.photo-grid img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 16px;
  border: 3px solid white;
  box-shadow: 0 4px 12px #75A9C655;
}

.buttons {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin: 20px 0 10px;
  min-height: 55px;
}

.small-note {
  font-size: 12px;
  color: #7C9BB2;
}

.final-photo {
  width: 100%;
  max-width: 370px;
  max-height: 65vh;
  object-fit: contain;
  border: 5px solid white;
  border-radius: 20px;
  margin: 12px auto;
  display: block;
  animation: pop .7s ease;
}

@keyframes pop {
  from { opacity: 0; transform: scale(.6); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>
<div class="cloud cloud1">☁️</div>
<div class="cloud cloud2">☁️</div>

<section class="page" id="opening">
  <div class="card">
    <div class="emoji">🩵☁️💨</div>
    <h1>Hai, Sania! 🩵</h1>
    <p>fencet sajoo 👀</p>
    <button class="open-btn" onclick="openInvite()">
      Buka undangan 💌
    </button>
  </div>
</section>

<section class="page hidden" id="invitation">
  <div class="card">
    <div class="emoji">🚬💨🩵</div>
    <h1>udut brok? 💨</h1>
    <p>Invitation from <b>Aca</b> for <b>Sania</b></p>

    <div class="letter">
      hey pokiemak 🩵<br><br>
      jalan jalan ke bandung, aca geulis pisan euy <br><br>
       yakin nih ga kangen??💨 
    </div>

    <div class="photo-grid">
      <img src="us.jpeg" alt="Foto Aca dan Sania">
      <img src="we.jpeg" alt="Foto Aca dan Sania">
    </div>

    <p><b>Jd gmna nich </b></p>

    <div class="buttons">
      <button class="yes-btn" onclick="acceptInvite()">
        GAS LAH! 💨
      </button>
      <button class="no-btn" id="noButton" onclick="shrinkNo()">
        Ga dulu brok
      </button>
    </div>

    <p class="small-note" id="hint">Pilih yang bener, Sania 😭</p>
  </div>
</section>

<section class="page hidden" id="ending">
  <div class="card">
    <div class="emoji">🎉🩵🎉</div>
    <h1>YEAYYYYY!! 😜🎉</h1>
    <p>LESGOOOOOO  BRANCUTTT!</p>
    <img src="aca.jpeg" alt="Aca lagi happy" class="final-photo">
    <p>See you, puki 🫶<br><b>— Aca</b></p>
    <div class="emoji">☁️💨🩵</div>
  </div>
</section>

<script>
function openInvite() {
  document.getElementById("opening").classList.add("hidden");
  document.getElementById("invitation").classList.remove("hidden");
  window.scrollTo(0, 0);
}

let noScale = 1;
let noClicks = 0;

function shrinkNo() {
  noClicks++;
  noScale = Math.max(0.06, noScale * 0.72);

  const btn = document.getElementById("noButton");
  btn.style.transform = "scale(" + noScale + ")";
  btn.style.opacity = Math.max(0.15, noScale);

  const messages = [
    "Salah pencet ya",
    "yakin?? ",
    "YAKINNNNNN",
    "HMMMZZZZZZZ",
    "YANG BENERR"
  ];

  document.getElementById("hint").textContent =
    messages[Math.min(noClicks - 1, messages.length - 1)];
}

function acceptInvite() {
  document.getElementById("invitation").classList.add("hidden");
  document.getElementById("ending").classList.remove("hidden");
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
